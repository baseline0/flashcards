type: service
language: python
test_framework: pytest
standards:
  type_hints: required
  docstrings: google-style
  max_line_length: 120
governance:
  enabled: true
  fixable-categories:
  - environment
  - config
  - discovery
  protected-paths:
  - .env
  - secrets.json
  - '*.key'
testing:
  min_coverage: 80
  test_command: pytest tests/
  coverage_report: html
guard-rails:
  max-lines-changed: 1000
  require-approval: false
schema_version: '1.0'
