name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The deploy waits for the same test suite that runs on every push to main. A red test stops the deploy.
  tests:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: tests
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Pages accepts the upload before the site serves it, so wait for the live page to show the expected content.
      - name: Smoke check the live page
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url" | grep -q "Modular Spaced Repetition Engine"; then
              echo "live: $url"
              exit 0
            fi
            sleep 10
          done
          echo "$url did not serve the expected page" >&2
          exit 1
