[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flashcards"
version = "0.1.0"
description = "Modular spaced repetition engine for arbitrary glossaries"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Mark Alexiuk", email = "malexiuk@gmail.com" },
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fsrs>=6.3.2",
    "genanki>=0.13.1",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
flashcards = "flashcards.cli:app"

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "pytest-cov>=4.1.0",
    "ruff==0.16.8",
    "mypy>=1.7.0",
    "pyright>=1.1.0",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flashcards"]

[tool.pytest.ini_options]
pythonpath = ["."]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", ".git", "__pycache__", "dist", "build", ".pytest_cache", ".mypy_cache", ".ruff_cache"]
# Markdown is not ruff territory: ruff 0.16 would reformat Python snippets inside it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4", "N", "RUF", "SIM", "TID"]
ignore = ["E501", "SIM105", "N818", "RUF001", "RUF002", "RUF022"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"argparse".msg = "Use typer for CLIs (fleet mandate)."
