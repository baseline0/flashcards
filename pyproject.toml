[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flashcards"
version = "0.1.0"
description = "Modular spaced repetition engine for arbitrary glossaries"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Mark Alexiuk", email = "malexiuk@gmail.com" },
]

dependencies = [
    "click>=8.0",
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fsrs>=6.3.2",
    "genanki>=0.13.1",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
flashcards = "flashcards.cli:app"

[dependency-groups]
dev = [
    {include-group = "test"},
    "ruff==0.16.8",
    "mypy>=1.7.0",
    "pyright>=1.1.0",
    "httpx>=0.28.1",
    "import-linter>=2.0.0,<3.0.0",
    "pre-commit>=4.6.2",
]
test = ["pytest>=7.4.3", "pytest-asyncio>=0.23.2", "pytest-cov>=4.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/flashcards"]

[tool.pytest.ini_options]
pythonpath = ["."]
minversion = "7.0"
addopts = "-ra --tb=short --strict-markers"
markers = ["unit: fast tests, run by the shared test-unit recipe", "integration: tests that use real services or files across components", "e2e: end-to-end tests of a whole workflow", "unit: deterministic, isolated, no network/services/sibling repos", "integration: cross-repo/service interaction; requires local setup", "host: runs on the real host (services, sibling repos, LXC); never in CI"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["src", "tests"]
pythonPlatform = "All"
exclude = ["**/__pycache__", ".git", ".ruff_cache", ".mypy_cache", ".pytest_cache", ".tox", ".venv", "build", "dist"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", ".git", "__pycache__", "dist", "build", ".pytest_cache", ".mypy_cache", ".ruff_cache"]
# Markdown is not ruff territory: ruff 0.16 would reformat Python snippets inside it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4", "N", "RUF", "SIM", "TID"]
ignore = ["E501", "SIM105", "N818", "RUF001", "RUF002", "RUF022"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]

# Per-module line-coverage floors, enforced by `just coverage`. A ratchet: raise, never lower.
argparse = {msg = "Use typer for CLIs: argparse is banned so every fleet CLI shares one framework with typed options and generated help."}
[tool.flashcards.coverage_floors]
"composite.py" = 100
"cli.py" = 89
"core/database.py" = 82
"domains/models.py" = 100
"generators/term_def_generator.py" = 90
"ingestion/json_parser.py" = 100
"server/app.py" = 77
"server/routes/api.py" = 86
"srs/fsrs_engine.py" = 100
"taxonomy.py" = 100

[tool.uv]
default-groups = ["dev"]

[tool.importlinter]
include_external_packages = true
