default_stages:
  - pre-commit
default_install_hook_types:
  - pre-commit
  - pre-push
repos:
  - repo: local
    hooks:
      - id: importlinter
        name: importlinter (architecture boundaries)
        entry: uv run --with import-linter lint-imports
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        stages: [pre-commit]
        pass_filenames: false

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of file fixer
        entry: end-of-file-fixer
        language: system
        types: [text]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-project-venv
        name: "[P0] VIRTUAL_ENV must be this repo's .venv"
        entry: fleet hook check-project-venv
        language: system
        pass_filenames: false
        always_run: true
      - id: repo-root-pattern
        name: "[P1] Enforce REPO_ROOT pattern (no .parent outside constants.py)"
        entry: fleet hook check-repo-root-pattern
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: check-argparse-prohibition
        name: "[P1] No argparse: CLIs use Typer"
        entry: fleet hook check-argparse-prohibition
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: just-test-unit
        name: '[P0] Pre-push: just test-unit (unit tests)'
        entry: env -u VIRTUAL_ENV just test-unit
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
